services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: turnierplan_test
      POSTGRES_PASSWORD: pass
    volumes:
      - './setup:/test-setup:ro'
      - './output:/test-output'
      - './assertions.sql:/assertions.sql:ro'
      - './schema-v2-ddl.sql:/schema-v2-ddl.sql:ro'
      - '../../schema-migration.sql:/schema-migration.sql:ro'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 1s
